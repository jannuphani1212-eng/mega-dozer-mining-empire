<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Mega Dozer: Mining Empire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#26384b,#101722);color:#fff;font:16px system-ui}.wrap{max-width:720px;margin:auto;padding:14px}.head{font-size:25px;font-weight:900}.head span{color:#f5bd4f}.stats,.actions,.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stats div,.panel{background:#202d3e;border:1px solid #526176;border-radius:13px;padding:12px}.stats small{display:block;color:#aebbd0}.stats b{color:#f5bd4f;font-size:21px}.mine{height:300px;position:relative;overflow:hidden;border:2px solid #8393a5;border-radius:17px;background:linear-gradient(#9bbbc8 0 28%,#69765e 28% 42%,#65513b 42%)}.sun{position:absolute;right:13%;top:10%;width:42px;height:42px;border-radius:50%;background:#ffe6a0;box-shadow:0 0 30px #ffe6a0}.mount{position:absolute;top:16%;left:-10%;width:120%;height:120px;background:#65745b;clip-path:polygon(0 100%,20% 30%,37% 85%,58% 0,78% 75%,92% 25%,100% 100%)}.dirt{position:absolute;inset:42% 0 0;background:repeating-linear-gradient(165deg,#594936 0 17px,#6b573f 18px 20px)}.dozer{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:76px;transition:left .2s}.rock{position:absolute;font-size:28px}.r1{left:12%;top:55%}.r2{right:15%;top:67%}.r3{left:62%;top:45%}.mineinfo{position:absolute;top:10px;left:10px;background:#111cce;padding:8px;border-radius:9px;font-size:12px}.bar{height:9px;background:#17202c;border-radius:9px;margin-top:6px;overflow:hidden}.fill{height:100%;width:0;background:#f5bd4f}.actions{grid-template-columns:1fr 1fr}.btn{background:#35475d;color:white;border:1px solid #687b91;border-radius:11px;padding:14px 8px;font-weight:800;font-size:15px}.primary{background:linear-gradient(120deg,#ffd36f,#d8892b);color:#251a0b;border:0}.btn:disabled{opacity:.4}.shop{grid-template-columns:1fr 1fr}.shop .btn{text-align:left;font-size:13px}.shop small{display:block;font-weight:400;margin-top:5px}.panel h3{margin:0 0 10px}.msg{text-align:center;color:#ffe3a0;min-height:24px;font-size:13px}.hint{color:#aebbd0;font-size:12px;line-height:1.5}
</style>
<main class="wrap"><div class="head">MEGA DOZER <span>MINING EMPIRE</span></div>
<section class="stats"><div><small>💰 CASH</small><b id="cash">250</b></div><div><small>⛏️ ORE</small><b id="ore">0 kg</b></div><div><small>🏆 LEVEL</small><b id="level">1</b></div></section>
<div class="mine" id="mine"><div class="sun"></div><div class="mount"></div><div class="dirt"></div><div class="mineinfo">ACTIVE MINE · <span id="site">Copper Ridge</span><div class="bar"><div class="fill" id="fill"></div></div></div><div class="rock r1">🪨</div><div class="rock r2">💎</div><div class="rock r3">🪨</div><div class="dozer" id="dozer">🚜</div></div>
<div class="msg" id="msg">Tap DIG to start your mining empire!</div><div class="actions"><button class="btn primary" id="dig">⛏️ DIG / MINE</button><button class="btn" id="sell">💰 SELL ORE</button></div>
<section class="panel"><h3>🔧 Garage upgrades</h3><div class="shop"><button class="btn" id="blade">🦾 Stronger blade<small id="bladeCost">Power +1 · $100</small></button><button class="btn" id="engine">⚙️ Turbo engine<small id="engineCost">Speed +1 · $150</small></button><button class="btn" id="bucket">📦 Bigger bucket<small id="bucketCost">Capacity +10 · $120</small></button><button class="btn" id="scanner">💎 Ore scanner<small id="scannerCost">Rare chance +5% · $200</small></button></div><p class="hint">Mine ore, sell your load, buy upgrades and unlock richer sites. Progress saves automatically on this device.</p></section>
</main>
<script>
(()=>{const $=x=>document.getElementById(x);let s={cash:250,ore:0,level:1,xp:0,power:1,speed:1,capacity:30,scanner:0,cost:{blade:100,engine:150,bucket:120,scanner:200}};try{s={...s,...JSON.parse(localStorage.getItem('megaDozerSave')||'{}')}}catch{}let busy=false;
const names=['Copper Ridge','Silver Valley','Gold Canyon','Crystal Mountain','Titanium Frontier'];function save(){localStorage.setItem('megaDozerSave',JSON.stringify(s))}function say(t){$('msg').textContent=t}
function draw(){ $('cash').textContent=Math.floor(s.cash);$('ore').textContent=s.ore+' kg';$('level').textContent=s.level;$('site').textContent=names[Math.min(4,s.level-1)];$('fill').style.width=100*s.ore/s.capacity+'%';for(let k of Object.keys(s.cost)){$(k+'Cost').textContent=({blade:'Power +1 · $',engine:'Speed +1 · $',bucket:'Capacity +10 · $',scanner:'Rare chance +5% · $'})[k]+s.cost[k];$(k).disabled=s.cash<s.cost[k]}$('dig').disabled=s.ore>=s.capacity;$('sell').disabled=s.ore===0;save()}
function dig(){if(busy||s.ore>=s.capacity)return;busy=true;$('dozer').style.left=(35+Math.random()*30)+'%';let rare=Math.random()<.04+s.scanner*.05,n=s.power+Math.floor(Math.random()*s.speed)+(rare?5:0);n=Math.min(n,s.capacity-s.ore);s.ore+=n;s.xp+=n;if(s.xp>=s.level*45){s.xp=0;s.level++;say('🎉 LEVEL UP! New mine unlocked!')}else say((rare?'💎 RARE DEPOSIT! ':'Strong dig! ')+`+${n} kg ore`);draw();setTimeout(()=>{busy=false;$('dozer').style.left='50%'},180)}
$('dig').onclick=dig;$('mine').onclick=dig;$('sell').onclick=()=>{let v=s.ore*(2+Math.floor(s.level/2));if(!s.ore)return;s.cash+=v;s.ore=0;say('Sold your ore for $'+v+'!');draw()};
for(let k of Object.keys(s.cost))$(k).onclick=()=>{if(s.cash<s.cost[k])return;s.cash-=s.cost[k];if(k==='blade')s.power++;if(k==='engine')s.speed++;if(k==='bucket')s.capacity+=10;if(k==='scanner')s.scanner++;s.cost[k]=Math.ceil(s.cost[k]*1.65);say('Upgrade installed! Keep mining.');draw()};draw();
})();
</script></html>
